<style>
/* Layout: a two-column spec sheet. A sticky identity column on the left, a scrolling record on the right; stacks to one column on phones. */
:root {
  /* Single dark theme, same in light and dark mode */
  --bg: #0a0d0b;
  --surface: #111613;
  --ink: #c9d6c4;         /* body text: soft off-white with a green cast */
  --bright: #f8f8f8;      /* name and headings */
  --muted: #8fb284;
  --line: #232b26;
  --accent: #5dd62c;
  --accent-soft: #15301a;
  --display: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Opening loader: pure black, a green "Loading..." and a thin-framed bar that fills with
   fine vertical stripes, dim at the start and bright at the leading edge. Site greens only. */
#loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #000;
  transition: opacity .5s ease, visibility .5s; }
#loader.done { opacity: 0; visibility: hidden; }
.load-box { width: min(440px, 84vw); display: grid; gap: 12px; }
.load-label { font-family: var(--mono); font-size: 1.15rem; letter-spacing: 0.02em; color: var(--accent);
  text-shadow: 0 0 8px rgba(93, 214, 44, 0.45); }
.load-track { height: 40px; padding: 5px; border: 1.5px solid #f8f8f8; }
.load-fill { height: 100%; width: 0%;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.35) 55%, rgba(0, 0, 0, 0) 92%),
              repeating-linear-gradient(90deg, #2fd66b 0 3px, transparent 3px 6px);
  box-shadow: 4px 0 10px -4px rgba(62, 224, 122, 0.8); }
html.loading, html.loading body { overflow: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1rem; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); text-underline-offset: 3px; }
#bits, #head, #eyes { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.wrap {
  max-width: 1120px; margin: 0 auto; padding-block: clamp(32px, 6vw, 72px);
  display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 88px);
}

/* Identity column */
.id { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 40px); align-self: start; display: grid; gap: 24px; }
.hero { grid-column: 1 / -1; display: grid; gap: 14px; min-width: 0; }
/* name, location and buttons are pulled out of the centred column to the left edge of the screen */
.wrap { --edge: min(0px, calc(clamp(16px, 3vw, 40px) - (100vw - min(1120px, 100vw - 32px)) / 2)); }
.hero, .id { margin-left: var(--edge); }
.name { font-family: var(--display); font-weight: 700; font-size: min(5rem, calc((100vw - 40px) / 18)); line-height: 1; letter-spacing: 0; }
.name, .name span { color: #f8f8f8; }
.name span { display: block; white-space: nowrap; }
/* Pixel mailbox button */
.mailbtn { display: inline-flex; align-items: center; gap: 10px; justify-self: start; padding: 6px 12px 6px 8px;
  color: #f8f8f8; text-decoration: none;
  /* glass: see-through tint, blurred backdrop, light rim and a soft top highlight */
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
  border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 10px;
  -webkit-backdrop-filter: blur(0.8px) saturate(140%); backdrop-filter: blur(0.8px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 18px rgba(0, 0, 0, 0.35);
  font-family: "Silkscreen", var(--mono); font-size: 0.75rem; letter-spacing: 0.04em;
  transition: border-color .15s, transform .15s, background-color .15s; }
.mailbtn:hover, .mailbtn:focus-visible { background-color: rgba(93, 214, 44, 0.12); }
.mailbtn svg { width: 48px; height: auto; overflow: visible; image-rendering: pixelated; }
.mailbtn .flag, .mailbtn .env { transition: transform .2s steps(2); }
.mailbtn:hover, .mailbtn:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
.mailbtn:hover span, .mailbtn:focus-visible span { color: var(--accent); }
.mailbtn:hover .flag, .mailbtn:focus-visible .flag { transform: translateY(-2px); }
.mailbtn:hover .env, .mailbtn:focus-visible .env { transform: translateX(3px); }
.mailbtn:active { transform: translateY(1px); }
.pxbtns { display: flex; flex-direction: column; align-items: stretch; gap: 10px; width: fit-content; min-width: 200px; }
.inbtn svg { width: 26px; }
.igbtn svg { width: 26px; }
.ghbtn svg { width: 26px; }
.ghbtn .eyes { opacity: 0; transition: opacity .15s steps(1); }
.ghbtn:hover .eyes, .ghbtn:focus-visible .eyes { opacity: 1; }
.igbtn .lens rect, .igbtn .dot rect { transition: fill .15s steps(1); }
.igbtn:hover .lens rect, .igbtn:focus-visible .lens rect { fill: #feda75; }
.igbtn:hover .dot rect, .igbtn:focus-visible .dot rect { fill: #fd0002; }
.inbtn .guy, .inbtn .tie { transition: transform .2s steps(2); transform-origin: 4px 6px; }
.inbtn:hover .guy, .inbtn:focus-visible .guy { transform: translateY(-1px); }
.inbtn:hover .tie, .inbtn:focus-visible .tie { transform: rotate(14deg); }
/* Digital glitch: a faint green ghost always, stronger split and binary letters in bursts */
.name { text-shadow: 2px 0 rgba(93, 214, 44, 0.28), -2px 0 rgba(26, 64, 41, 0.9); }
.name.jolt { text-shadow: 5px 0 rgba(93, 214, 44, 0.75), -4px 0 rgba(47, 214, 107, 0.45); }
.name .glitching { color: #5dd62c; text-align: center; text-shadow: 0 0 10px rgba(93, 214, 44, 0.6); }
.greet { margin: 0 0 -4px; font-family: var(--display); font-size: clamp(1rem, 2vw, 1.5rem); letter-spacing: 0.06em; color: var(--accent); }
.role { font-size: 1.1rem; color: var(--bright); margin: 0; }
.role b { color: var(--accent); font-weight: 600; }
.coords { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); letter-spacing: 0.04em; display: grid; gap: 2px; }

/* Record column */
/* Scroll transition: digital rain sweeps over the first screen while it is wiped away, then the radar takes over */
#rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
/* Radar: the second screen, a glowing dial with a rotating sweep */
.radar-sec { position: relative; z-index: 1; height: 100vh; height: 100svh; display: grid; place-items: center; overflow: hidden; }
/* as big as the screen allows: the dial fills the height (or the width on a tall phone) */
#radar { width: min(100vw, 100vh); width: min(100vw, 100svh); aspect-ratio: 1; display: block; }
.summary { font-family: var(--mono); font-size: 0.86rem; line-height: 1.7; margin: 0; color: #f8f8f8;
  /* same glass as the buttons, sitting under them in the left column */
  padding: 16px 18px; border-radius: 12px;
  /* a dark smoked glass so the text stays readable over the digits */
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02)), rgba(8, 12, 9, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.16);
  -webkit-backdrop-filter: blur(0.8px) saturate(140%); backdrop-filter: blur(0.8px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 6px 18px rgba(0, 0, 0, 0.35); }
.summary em { font-style: normal; }

section { display: grid; gap: 24px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.sec-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--bright); }
.sec-head h2::before { content: "> "; color: var(--accent); }
.sec-head small { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; }

/* Experience timeline */
.jobs { display: grid; gap: 0; }
.job { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.job:last-child { border-bottom: 0; }
.when { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; }
.job h3 { font-size: 1.12rem; font-weight: 600; color: var(--accent); }
.job .meta { font-size: 0.88rem; color: var(--muted); margin: 2px 0 10px; }
.job li::marker { color: var(--muted); }
.job ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 64ch; }

/* Projects */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.proj { background: var(--surface); border: 1px solid var(--line); padding: 22px; display: grid; gap: 10px; align-content: start; }
.proj.lead { grid-column: 1 / -1; border-color: var(--accent); }
.proj .tag { font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.proj h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.3; color: var(--bright); }
.proj p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.modules { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.modules span { font-family: var(--mono); font-size: 0.72rem; padding: 3px 9px; border: 1px solid var(--line); color: var(--muted); }

/* Skills */
.skills { display: grid; gap: 0; }
.skill { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 24px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.skill:last-child { border-bottom: 0; }
.skill .k { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); padding-top: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 500; }

/* Education + awards */
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(32px, 5vw, 56px); }
.list { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; gap: 2px; }
.list b { font-weight: 600; color: var(--bright); }
.list .sub { color: var(--muted); font-size: 0.9rem; }
.list .yr { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prize { font-family: var(--display); font-weight: 700; font-size: 1.6rem; color: var(--accent); line-height: 1; }

footer { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .id { position: static; }
}
@media (max-width: 600px) {
  .job, .skill { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .projects, .two { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .proj { transition: border-color .2s, transform .2s; }
  .proj:hover { transform: translateY(-2px); border-color: var(--accent); }
}
</style>

<div id="loader" role="status" aria-live="polite" aria-label="Loading">
  <div class="load-box">
    <div class="load-label">Loading<span id="load-dots">...</span></div>

<script>
  // The bar fills over at least ~1.8 s, holds near the end until the page has loaded, then the
  // loader fades out and tells the intro animation to start.
  (function () {
    var root = document.documentElement, loader = document.getElementById("loader");
    var fill = document.getElementById("load-fill"), dots = document.getElementById("load-dots");
    var start = performance.now(), loaded = document.readyState === "complete", MIN = 1800, over = false;
    root.classList.add("loading");
    addEventListener("load", function () { loaded = true; });
    var dotTimer = setInterval(function () { dots.textContent = ".".repeat(dots.textContent.length % 3 + 1); }, 380);
    function finish() {
      if (over) return; over = true; clearInterval(dotTimer);
      fill.style.width = "100%";
      setTimeout(function () {
        loader.classList.add("done"); root.classList.remove("loading");
        window.__loaderDone = true; dispatchEvent(new Event("loader:done"));
        setTimeout(function () { loader.remove(); }, 700);
      }, 220);
    }
    (function tick(now) {
      if (over) return;
      var t = Math.min(1, (now - start) / MIN), eased = 1 - Math.pow(1 - t, 2);
      var p = Math.min(eased, loaded ? 1 : 0.88);
      fill.style.width = (p * 100).toFixed(1) + "%";
      if (p >= 1) { finish(); return; }
      requestAnimationFrame(tick);
    })(start);
    setTimeout(finish, 8000);   // never hang
  })();
</script>

<script>
  // Pixelated binary background: 0s and 1s drawn as 3x5 pixel glyphs; a few flip every moment.
  // A wireframe head (img/face.png) is redrawn as a finer layer of the same digits, brightest where
  // the image is brightest. It stays put behind the content as you scroll.
  // The digits scatter away from the cursor and drift back once it moves on.
  (function () {
    var cv = document.getElementById("bits"), ctx = cv.getContext("2d");
    var GLYPH = { 0: ["111","101","101","101","111"], 1: ["010","110","010","010","111"] };
    var PX = 2, CW = PX * 3 + PX * 2, CH = PX * 5 + PX * 2; // glyph + gap
    var OX = 6, OY = 6;                 // grid offset
    var RADIUS = 90, PUSH = 34;          // cursor field size and how far digits get pushed (px)
    var cells = [], cols = 0, rows = 0, hot = new Set();
    // Solid dark-green tints for the field (no transparency, so the hue stays clean)
    var TINTS = ["#0f2618", "#122e1d", "#163723", "#1a4029"];
    var BASE_RGB = TINTS.map(hex), HOT_RGB = hex("#2fd66b");
    function hex(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
    function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
    function css(c) { return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
    function rand() { return Math.random() < 0.3 ? -1 : (Math.random() < 0.5 ? 0 : 1); }

    // ---- Head: a wireframe face sampled from an image and drawn as tiny digits on its own layer ----
    var face = { x: 0, y: 0, s: 1 }, burst = false;
    var hv = document.createElement("canvas"), hctx = hv.getContext("2d");
    hv.id = "head"; hv.setAttribute("aria-hidden", "true"); cv.after(hv);
    var HSX = 4, HSY = 6;                                   // fine digit step: 3x5 glyph + 1px gap
    var LOW = hex("#123a1e"), HIGH = hex("#86e870");   // kept mid-bright so text on top stays readable
    var head = [], hiddenIdx = [], headImg = new Image(), box = { x0: 0, y0: 0, S: 0 };
    headImg.onload = function () { buildHead(); hiddenIdx.forEach(draw); drawHead(); drawEyes(); };
    headImg.src = "img/face.png";
    // The head fills the screen: as tall as the viewport, centred, sitting behind the content.
    function placeFace(w, h) {
      box.S = Math.round(h * 1.02); box.x0 = Math.round((w - box.S) / 2); box.y0 = Math.round((h - box.S) / 2);
      face.s = box.S / 2.45; face.x = w / 2; face.y = h / 2;
    }
    function buildHead() {
      head = []; hiddenIdx.forEach(function (i) { if (cells[i]) cells[i].hide = false; }); hiddenIdx = [];
      if (!headImg.complete || !headImg.naturalWidth || box.S < 10) return;
      var S = box.S, off = document.createElement("canvas"); off.width = S; off.height = S;
      var octx = off.getContext("2d"); octx.drawImage(headImg, 0, 0, S, S);
      var data = octx.getImageData(0, 0, S, S).data;
      function lum(x, y) {                                  // brightness 0..1 around (x, y); the neck fades out
        x = Math.max(0, Math.min(S - 1, Math.round(x))); y = Math.max(0, Math.min(S - 1, Math.round(y)));

        var l = (lum(x + 1, y + 1) + lum(x + 1, y + 3) + lum(x + 2, y + 2)) / 3;
        if (l > 0.07) head.push({ x: box.x0 + x, y: box.y0 + y, l: l, v: Math.random() < 0.5 ? 0 : 1 });
      }
      // hide the coarse background digits that sit inside the head's silhouette
      var c0 = Math.max(0, Math.floor((box.x0 - OX) / CW)), c1 = Math.min(cols - 1, Math.ceil((box.x0 + S - OX) / CW));
      var r0 = Math.max(0, Math.floor((box.y0 - OY) / CH)), r1 = Math.min(rows - 1, Math.ceil((box.y0 + S - OY) / CH));
      for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
        var px = c * CW + OX + PX * 1.5 - box.x0, py = r * CH + OY + PX * 2.5 - box.y0;
        if (px < 0 || py < 0 || px >= S || py >= S) continue;
        if (lum(px, py) > 0.1 || lum(px - 4, py) > 0.1 || lum(px + 4, py) > 0.1) { cells[r * cols + c].hide = true; hiddenIdx.push(r * cols + c); }
      }
    }
    function headColor(n) { return css(mixRGB(LOW, HIGH, Math.pow(n.l, 1.3))); }
    function paintHeadDigit(n) {
      hctx.fillStyle = headColor(n);
      var g = GLYPH[n.v];
      for (var r = 0; r < 5; r++) for (var k = 0; k < 3; k++) if (g[r][k] === "1") hctx.fillRect(n.x + k, n.y + r, 1, 1);
    }
    function drawHead() {
      hctx.clearRect(0, 0, innerWidth, innerHeight);
      if (!burst) head.forEach(paintHeadDigit);
    }
    function flickerHead(count) {
      if (burst || !head.length) return;
      for (var n = 0; n < count; n++) {
        var d = head[Math.floor(Math.random() * head.length)]; d.v = 1 - d.v;

    }

    var ev = document.createElement("canvas"), ectx = ev.getContext("2d");

    function drawEyes() {
      if (eyeBox) ectx.clearRect(eyeBox.x - 2, eyeBox.y - 2, eyeBox.w + 4, eyeBox.h + 4);

      var S = box.S, rx = S * 0.07, ry = S * 0.035, pr = S * 0.02;

      ctx.fillText(done ? "ALL SKILLS LOCATED" : "SCANNING FOR SKILLS" + ".".repeat(1 + Math.floor(now / 400) % 3), S * 0.02, S * 0.985);

<script>
  // Scroll transition from the first screen to the radar, in the style of digital rain:
  // over the first screen's height of scrolling, columns of falling 0s and 1s sweep down the
  // screen, the name, buttons and summary are wiped away from the top behind them, the head
  // fades out, and the radar fades and grows in.
  (function () {
    var wrap = document.querySelector(".wrap"), radar = document.getElementById("radar");
    var parts = Array.prototype.slice.call(document.querySelectorAll(".wrap > .hero, .wrap > .id"));
    var head = document.getElementById("head"), eyes = document.getElementById("eyes");
    if (!wrap || !radar) return;
    var calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    var cv = document.createElement("canvas"), ctx = cv.getContext("2d");
    cv.id = "rain"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv);
    var W = 0, H = 0, dpr = 1, COL = 16, cols = [], p = 0, running = false;
    function size() {
      dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cols = [];
      for (var x = 0; x < W; x += COL) cols.push({ x: x, y: -Math.random() * H, v: 4 + Math.random() * 7, len: 8 + Math.floor(Math.random() * 14), g: [] });
    }
    function glyph() { return Math.random() < 0.5 ? "0" : "1"; }
    function smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }

    function rain() {
      ctx.clearRect(0, 0, W, H);
      var a = Math.pow(Math.sin(Math.PI * p), 0.6);              // strongest mid-transition
      if (a < 0.02 || calm) { running = false; return; }
      ctx.font = "500 15px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
      cols.forEach(function (c) {
        c.y += c.v; if (c.y - c.len * COL > H) { c.y = -Math.random() * H * 0.3; c.v = 4 + Math.random() * 7; }
        if (Math.random() < 0.3 || !c.g.length) c.g.unshift(glyph());
        if (c.g.length > c.len) c.g.length = c.len;
        for (var k = 0; k < c.g.length; k++) {
          var y = c.y - k * COL; if (y < -COL || y > H + COL) continue;
          var fade = 1 - k / c.len;
          ctx.fillStyle = k === 0 ? "rgba(216, 255, 196," + a + ")" : "rgba(93, 214, 44," + (a * fade * 0.9) + ")";
          ctx.fillText(c.g[k], c.x + COL / 2, y);
        }
      });
      requestAnimationFrame(rain);
    }

    function update() {
      // progress over the scroll it takes to bring the radar fully into view
      var span = Math.max(1, Math.min(innerHeight * 0.9, document.documentElement.scrollHeight - innerHeight));
      p = Math.max(0, Math.min(1, scrollY / span));
      // wipe the first screen away from the top, a soft edge following the rain down
      // (the mask goes on the pieces themselves, not .wrap: they stick out left of the centred
      // column, and a mask on .wrap would clip everything outside its box)
      if (p <= 0.001) {
        parts.forEach(function (el) { el.style.webkitMaskImage = el.style.maskImage = ""; });
        wrap.style.opacity = "";
      } else {
        var cut = p * 1.25 * innerHeight, wrapTop = wrap.getBoundingClientRect().top;
        parts.forEach(function (el) {
          var c = cut - (el.getBoundingClientRect().top - wrapTop);      // the cut in this piece's own coordinates
          var m = "linear-gradient(to bottom, transparent " + (c - 0.25 * innerHeight) + "px, #000 " + c + "px)";
          el.style.webkitMaskImage = m; el.style.maskImage = m;
        });
        wrap.style.opacity = String(1 - smooth((p - 0.55) / 0.45));
      }
      var fadeHead = String(1 - smooth(p / 0.8));
      if (head) head.style.opacity = fadeHead;
      if (eyes) eyes.style.opacity = fadeHead;
      // the radar spins into place as you scroll: it turns from -150°, grows from 55%,
      // comes into focus from a blur, and fades in, all following the scroll position
      var r = smooth((p - 0.2) / 0.8);
      radar.style.opacity = String(r);
      // spins two full turns on the way in (a quarter turn reads as almost nothing on a round dial)
      radar.style.transform = "rotate(" + (-720 * (1 - r)).toFixed(2) + "deg) scale(" + (0.55 + 0.45 * r).toFixed(3) + ")";
      radar.style.filter = r < 0.999 ? "blur(" + (8 * (1 - r)).toFixed(2) + "px)" : "";
      if (!running && !calm && p > 0.01 && p < 0.99) { running = true; requestAnimationFrame(rain); }
    }
    size(); update();
    addEventListener("resize", function () { size(); update(); });
    addEventListener("scroll", update, { passive: true });
  })();
</script>

<script>
  (function () {
    if (!window.gsap) return; // page still works if GSAP fails to load
    gsap.registerPlugin(ScrollTrigger, SplitText);
    var mm = gsap.matchMedia();
    mm.add("(prefers-reduced-motion: no-preference)", function () {
      // 1. Intro: name letters rise in, then the rest of the identity column
      var split = SplitText.create(".name", { type: "chars", mask: "chars" });
      var tl = gsap.timeline({ defaults: { ease: "power3.out" }, paused: !window.__loaderDone });
      if (!window.__loaderDone) addEventListener("loader:done", function () { tl.play(); }, { once: true });
      tl.from(split.chars, { yPercent: 110, duration: 0.7, stagger: 0.025 })
        .from(".greet", { y: 10, opacity: 0, duration: 0.4 }, 0)
        .from(".role", { y: 12, opacity: 0, duration: 0.5 }, "-=0.4")
        .from(".id > *", { y: 16, opacity: 0, duration: 0.5, stagger: 0.07 }, "-=0.4");   // includes the summary card

      // 1b. Digital glitch on the name: once the intro is done, letters now and then
      //     flicker into green 0s and 1s (like the background) and the line jolts sideways
      var gsplit = null, glitchTimer = null, name = document.querySelector(".name");
      tl.call(function () {
        split.revert();                                   // drop the intro masks so glitches aren't clipped
        gsplit = SplitText.create(".name", { type: "chars" });
        glitchLoop();
      });
      function glitchLoop() {
        glitchTimer = setTimeout(function () { if (!document.hidden) burst(); glitchLoop(); }, 1400 + Math.random() * 2600);
      }
      function burst() {
        var chars = gsplit.chars, picks = [], count = 1 + Math.floor(Math.random() * 4);
        while (picks.length < count) { var c = chars[Math.floor(Math.random() * chars.length)]; if (c.textContent.trim() && picks.indexOf(c) < 0) picks.push(c); }
        picks.forEach(function (c) {
          var orig = c.textContent, w = c.getBoundingClientRect().width, steps = 2 + Math.floor(Math.random() * 3), i = 0;
          c.style.width = w + "px"; c.classList.add("glitching");
          (function step() {
            if (i++ < steps) { c.textContent = Math.random() < 0.5 ? "0" : "1"; setTimeout(step, 45 + Math.random() * 60); }
            else { c.textContent = orig; c.style.width = ""; c.classList.remove("glitching"); }
          })();
        });
        if (Math.random() < 0.55) {                       // whole-line jolt with a green colour split
          name.classList.add("jolt");
          gsap.fromTo(name, { x: gsap.utils.random(-6, 6), skewX: gsap.utils.random(-8, 8) },
            { x: 0, skewX: 0, duration: 0.18, ease: "steps(3)", onComplete: function () { name.classList.remove("jolt"); } });
        }
      }

      // 2. Sections: heading rule draws in, items lift as they scroll into view
      gsap.utils.toArray(".record section").forEach(function (sec) {
        var head = sec.querySelector(".sec-head");
        var items = sec.querySelectorAll(".job, .proj, .skill, .list li");
        var t = gsap.timeline({ scrollTrigger: { trigger: sec, start: "top 85%", once: true } });
        t.from(head, { clipPath: "inset(0 100% 0 0)", duration: 0.6, ease: "power2.out" })
         .from(items, { y: 24, opacity: 0.2, duration: 0.5, stagger: 0.08, ease: "power2.out" }, "-=0.3");
      });

      // 3. Prize counter: count up to 2 when it appears
      var prize = document.querySelector(".prize");
      if (prize) {
        var n = { v: 0 };
        gsap.to(n, { v: 2, duration: 1.2, ease: "power1.out",
          scrollTrigger: { trigger: prize, start: "top 90%", once: true },
          onUpdate: function () { prize.textContent = "₹" + n.v.toFixed(1).replace(/\.0$/, "") + " lakh"; } });
      }
      return function () { clearTimeout(glitchTimer); if (gsplit) gsplit.revert(); split.revert(); };
    });
  })();
</script>
